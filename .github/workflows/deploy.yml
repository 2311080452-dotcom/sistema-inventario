name: Despliegue del Sistema de Inventario

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versión liberada a desplegar (ej. v1.0.2)'
        required: true
        default: 'v1.0.2'
      version_anterior:
        description: 'Versión instalada previamente en el servidor (opcional, para recuperación)'
        required: false
        default: ''
      almacen:
        description: 'Configuración: nombre del almacén (requerido desde v1.1.0)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
      VERSION: ${{ inputs.version }}
      ANTERIOR: ${{ inputs.version_anterior }}

    steps:
      # Servidor Linux de destino simulado: contenedor con Node.js y servidor SSH
      - name: Iniciar servidor de destino (simulado)
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          for s in DEPLOY_HOST DEPLOY_USER DEPLOY_PORT DEPLOY_KEY; do
            if [ -z "${!s}" ]; then echo "::error::Falta configurar el secreto $s"; exit 1; fi
            if [ "$s" != "DEPLOY_KEY" ] && [[ "${!s}" =~ [[:space:]] ]]; then
              echo "::error::El secreto $s contiene espacios o tabuladores"; exit 1
            fi
          done
          install -m 600 /dev/null /tmp/llave
          printf '%s\n' "$DEPLOY_KEY" > /tmp/llave
          ssh-keygen -y -f /tmp/llave > /tmp/llave.pub
          docker run -d --name servidor-destino -p "${DEPLOY_PORT}:22" \
            -e USUARIO="$DEPLOY_USER" -e PUBKEY="$(cat /tmp/llave.pub)" \
            node:20-bookworm-slim bash -c '
              apt-get update -qq && apt-get install -y -qq openssh-server unzip > /dev/null &&
              useradd -m -s /bin/bash "$USUARIO" &&
              mkdir -p /home/$USUARIO/.ssh /run/sshd &&
              echo "$PUBKEY" > /home/$USUARIO/.ssh/authorized_keys &&
              chown -R $USUARIO:$USUARIO /home/$USUARIO/.ssh &&
              chmod 700 /home/$USUARIO/.ssh && chmod 600 /home/$USUARIO/.ssh/authorized_keys &&
              exec /usr/sbin/sshd -D -e'
          rm -f /tmp/llave /tmp/llave.pub

      - name: Configurar conexión SSH
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh
          install -m 600 /dev/null ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          for i in $(seq 1 60); do
            ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" > ~/.ssh/known_hosts 2>/dev/null && [ -s ~/.ssh/known_hosts ] && break
            sleep 2
          done
          if [ ! -s ~/.ssh/known_hosts ]; then echo "::error::No se pudo conectar a $DEPLOY_HOST:$DEPLOY_PORT"; exit 1; fi
          echo "Conexión SSH disponible en $DEPLOY_HOST:$DEPLOY_PORT"
          echo "SSH=ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT $DEPLOY_USER@$DEPLOY_HOST" >> "$GITHUB_ENV"
          echo "SCP=scp -i $HOME/.ssh/deploy_key -P $DEPLOY_PORT" >> "$GITHUB_ENV"

      - name: Preparar entorno de destino
        run: |
          $SSH 'echo "Servidor: $(hostname)"; uname -sr; echo "Usuario: $(whoami)";
                echo "Node.js: $(node --version)"; echo "unzip: $(unzip -v | head -1)";
                mkdir -p ~/sistema-inventario && echo "Directorio listo: ~/sistema-inventario"'

      - name: Descargar versión anterior
        if: inputs.version_anterior != ''
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.version_anterior }}
          fileName: sistema-inventario-${{ inputs.version_anterior }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Instalar versión anterior en el servidor
        if: inputs.version_anterior != ''
        run: |
          $SCP "sistema-inventario-$ANTERIOR.zip" "$DEPLOY_USER@$DEPLOY_HOST:~/sistema-inventario/"
          $SSH "cd ~/sistema-inventario && mkdir -p version-$ANTERIOR &&
                unzip -oq sistema-inventario-$ANTERIOR.zip -d version-$ANTERIOR &&
                ln -sfn version-$ANTERIOR actual && cd actual && node dist/index.js | head -4"

      - name: Descargar versión liberada
        uses: robinraju/release-downloader@v1
        with:
          repository: ${{ github.repository }}
          tag: ${{ inputs.version }}
          fileName: sistema-inventario-${{ inputs.version }}.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Transferir paquete al servidor
        run: |
          $SCP "sistema-inventario-$VERSION.zip" "$DEPLOY_USER@$DEPLOY_HOST:~/sistema-inventario/"
          $SSH "ls -l ~/sistema-inventario/*.zip"

      - name: Preparar versión en el servidor
        run: |
          $SSH "cd ~/sistema-inventario && mkdir -p version-$VERSION &&
                unzip -oq sistema-inventario-$VERSION.zip -d version-$VERSION &&
                ls -R version-$VERSION &&
                ln -sfn version-$VERSION actual && echo && ls -l ~/sistema-inventario"

      - name: Ejecutar y verificar el despliegue
        id: verificar
        continue-on-error: true
        env:
          ALMACEN: ${{ inputs.almacen }}
        run: |
          $SSH "cd ~/sistema-inventario/actual && INVENTARIO_ALMACEN='$ALMACEN' node dist/index.js"

      - name: Recuperar versión anterior
        if: steps.verificar.outcome == 'failure' && inputs.version_anterior != ''
        run: |
          echo "La versión $VERSION falló. Se restaura $ANTERIOR."
          $SSH "cd ~/sistema-inventario && ln -sfn version-$ANTERIOR actual && ls -l ~/sistema-inventario &&
                echo && cd actual && node dist/index.js"

      - name: Resultado del despliegue
        run: |
          if [ "${{ steps.verificar.outcome }}" = "success" ]; then
            echo "### ✅ Despliegue exitoso de $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "Despliegue exitoso: $VERSION"
          elif [ -n "$ANTERIOR" ]; then
            echo "### ❌ $VERSION falló — se recuperó $ANTERIOR" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::El despliegue de $VERSION falló; el servidor quedó funcionando con $ANTERIOR"
            exit 1
          else
            echo "### ❌ Despliegue fallido de $VERSION" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::El despliegue de $VERSION falló"
            exit 1
          fi
